contents:
  get:
    summary: Lista todos los contenidos del usuario autenticado
    tags:
      - Contents
    security:
      - bearerAuth: []
    responses:
      "200":
        description: Lista de contenidos (vacía si no hay ninguno)
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../schemas/contents.yaml#/ContentResponse"
      "401":
        description: No autenticado
      "500":
        description: Error interno

  post:
    summary: Crea un nuevo contenido
    tags:
      - Contents
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/contents.yaml#/CreateContentRequest"
    responses:
      "201":
        description: Contenido creado correctamente
        content:
          application/json:
            schema:
              $ref: "../schemas/contents.yaml#/ContentResponse"
      "400":
        description: Datos inválidos (título, content, status, visibility o category_id)
      "401":
        description: No autenticado
      "404":
        description: Categoría no encontrada o no pertenece al usuario
      "409":
        description: Ya existe un contenido con ese slug
      "500":
        description: Error interno

content-by-id:
  get:
    summary: Obtiene un contenido por ID
    tags:
      - Contents
    security:
      - bearerAuth: []
    parameters:
      - name: content_id
        in: path
        required: true
        schema:
          $ref: "../schemas/common.yaml#/UUID"
        description: ID del contenido
    responses:
      "200":
        description: Contenido encontrado
        content:
          application/json:
            schema:
              $ref: "../schemas/contents.yaml#/ContentResponse"
      "401":
        description: No autenticado
      "404":
        description: Contenido no encontrado
      "500":
        description: Error interno

  patch:
    summary: Actualiza parcialmente un contenido
    tags:
      - Contents
    security:
      - bearerAuth: []
    parameters:
      - name: content_id
        in: path
        required: true
        schema:
          $ref: "../schemas/common.yaml#/UUID"
        description: ID del contenido
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/contents.yaml#/UpdateContentRequest"
    responses:
      "200":
        description: Contenido actualizado correctamente
        content:
          application/json:
            schema:
              $ref: "../schemas/contents.yaml#/ContentResponse"
      "400":
        description: Datos inválidos (título vacío, content no-objeto, status/visibility inválido, category_id mal formado)
      "401":
        description: No autenticado
      "404":
        description: Contenido o categoría no encontrados
      "409":
        description: Ya existe un contenido con ese slug
      "500":
        description: Error interno

  delete:
    summary: Mueve un contenido a la papelera (soft delete)
    description: |
      Marca el contenido como eliminado estableciendo `deleted_at` y
      `delete_after` (30 días). Solo opera si el contenido no está ya en
      la papelera (`deleted_at IS NULL`). El contenido desaparece de los
      listados normales y queda accesible en `GET /contents/trash`.
    tags:
      - Contents
    security:
      - bearerAuth: []
    parameters:
      - name: content_id
        in: path
        required: true
        schema:
          $ref: "../schemas/common.yaml#/UUID"
        description: ID del contenido
    responses:
      "204":
        description: Contenido movido a la papelera (sin body)
      "401":
        description: No autenticado
      "404":
        description: Contenido no encontrado, no pertenece al usuario o ya está en la papelera
      "500":
        description: Error interno

content-trash:
  get:
    summary: Lista los contenidos en la papelera del usuario autenticado
    description: |
      Devuelve todos los contenidos que tienen `deleted_at IS NOT NULL`,
      ordenados por `deleted_at DESC` (eliminados más recientemente primero).
    tags:
      - Contents
    security:
      - bearerAuth: []
    responses:
      "200":
        description: Lista de contenidos en papelera (vacía si no hay ninguno)
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../schemas/contents.yaml#/ContentResponse"
      "401":
        description: No autenticado
      "500":
        description: Error interno

content-restore:
  patch:
    summary: Restaura un contenido de la papelera
    description: |
      Establece `deleted_at = NULL` y `delete_after = NULL`. Solo opera si
      el contenido está en la papelera (`deleted_at IS NOT NULL`).
      Devuelve el contenido con los campos de borrado en null.
    tags:
      - Contents
    security:
      - bearerAuth: []
    parameters:
      - name: content_id
        in: path
        required: true
        schema:
          $ref: "../schemas/common.yaml#/UUID"
        description: ID del contenido
    responses:
      "200":
        description: Contenido restaurado correctamente
        content:
          application/json:
            schema:
              $ref: "../schemas/contents.yaml#/ContentResponse"
      "401":
        description: No autenticado
      "404":
        description: Contenido no encontrado, no pertenece al usuario o no está en la papelera
      "500":
        description: Error interno

content-permanent:
  delete:
    summary: Elimina permanentemente un contenido de la papelera
    description: |
      Solo opera sobre contenidos que estén en la papelera (`deleted_at IS NOT NULL`).
      La operación es irreversible: borra el contenido y sus relaciones
      `content_files` y `content_tags` (por cascade). Los ficheros que estaban
      vinculados únicamente a este contenido se eliminan también del storage
      (best-effort, transparente al cliente).
    tags:
      - Contents
    security:
      - bearerAuth: []
    parameters:
      - name: content_id
        in: path
        required: true
        schema:
          $ref: "../schemas/common.yaml#/UUID"
        description: ID del contenido
    responses:
      "204":
        description: Contenido eliminado permanentemente (sin body)
      "401":
        description: No autenticado
      "404":
        description: Contenido no encontrado, no pertenece al usuario o no está en la papelera
      "500":
        description: Error interno